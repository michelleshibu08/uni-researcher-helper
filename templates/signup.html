{% extends "base.html" %}

{% block title %}Sign up · Researchify{% endblock %}

{% block content %}
<section class="auth-card">
  <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="52" height="52">
  <h1>Create your account</h1>
  <p class="details">Keep all your essay projects in one place and open them on any device.</p>
  <form class="claim" action="{{ url_for('signup') }}" method="post">
    {% include "_auth_form.html" %}
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" value="{{ name }}" autocomplete="name" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required>
    <label for="password">Password <span class="details">(at least 8 characters)</span></label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Sign up</button>
  </form>
  <p class="details">Already have an account? <a href="{{ url_for('login', next=request.values.get('next', '')) }}">Log in</a></p>
</section>
{% endblock %}
