<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Research Helper{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('home') }}">Research Helper</a>
    <span class="tagline">Find, cite and check academic papers</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Searching can take a few seconds when the API is busy, so show that it's working.
    document.querySelectorAll("form").forEach(function (form) {
      form.addEventListener("submit", function () {
        var button = form.querySelector("button[type=submit]");
        button.disabled = true;
        button.textContent = "Working...";
      });
    });

    // Copy a reference to the clipboard when its "Copy" button is clicked.
    document.querySelectorAll("[data-copy]").forEach(function (button) {
      button.addEventListener("click", function () {
        navigator.clipboard.writeText(button.dataset.copy);
        button.textContent = "Copied";
        setTimeout(function () { button.textContent = "Copy"; }, 1500);
      });
    });
  </script>
</body>
</html>
