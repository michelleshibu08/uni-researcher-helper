<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Research Helper{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('home') }}"><span class="logo-mark">R</span>Research Helper</a>
    <nav class="nav">
      <a href="{{ url_for('essay') }}">Check my essay</a>
      <a href="{{ url_for('verify') }}">Check my references</a>
      <a href="{{ url_for('references') }}">My references (<span id="saved-count">0</span>)</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Research Helper · Paper data from <a href="https://openalex.org" target="_blank">OpenAlex</a>
    and <a href="https://www.semanticscholar.org" target="_blank">Semantic Scholar</a> ·
    Always double-check your references before you submit.
  </footer>
  <script>
    // Saved papers are kept in this browser's storage, so there's no account to set up.
    function loadSaved() {
      try {
        return JSON.parse(localStorage.getItem("savedPapers")) || [];
      } catch (error) {
        return [];
      }
    }

    function saveAll(papers) {
      try {
        localStorage.setItem("savedPapers", JSON.stringify(papers));
      } catch (error) {
        // Storage can be blocked (for example in private browsing); the list just won't be kept.
      }
      document.getElementById("saved-count").textContent = papers.length;
    }

    document.getElementById("saved-count").textContent = loadSaved().length;

    // Searching can take a few seconds when the API is busy, so show that it's working.
    document.querySelectorAll("form").forEach(function (form) {
      form.addEventListener("submit", function (event) {
        var button = event.submitter || form.querySelector("button[type=submit]");
        button.classList.add("busy");
        button.textContent = "Working...";
      });
    });

    // Copy a reference to the clipboard when its "Copy" button is clicked.
    document.querySelectorAll("[data-copy]").forEach(function (button) {
      button.addEventListener("click", function () {
        navigator.clipboard.writeText(button.dataset.copy);
        button.textContent = "Copied";
        setTimeout(function () { button.textContent = "Copy"; }, 1500);
      });
    });

    // Picking another style shows that style's reference, ready to copy.
    document.querySelectorAll(".other-style").forEach(function (row) {
      var picker = row.querySelector(".style-picker");
      picker.addEventListener("change", function () {
        var option = picker.selectedOptions[0];
        row.querySelector(".picked-reference").textContent = option.dataset.reference;
        row.querySelector(".picked-copy").dataset.copy = option.dataset.reference;
        var intext = row.querySelector(".picked-intext");
        intext.hidden = !option.dataset.intext;
        intext.textContent = "In your essay: " + option.dataset.intext;
      });
    });

    // "Save" adds a paper to the reference list, and pressing it again removes it.
    document.querySelectorAll("[data-save]").forEach(function (button) {
      var paper = JSON.parse(button.dataset.save);
      function isSaved() {
        return loadSaved().some(function (p) { return p.id === paper.id; });
      }
      function showState() {
        button.textContent = isSaved() ? "Saved ✓" : "Save to my references";
      }
      button.addEventListener("click", function () {
        var others = loadSaved().filter(function (p) { return p.id !== paper.id; });
        saveAll(isSaved() ? others : others.concat([paper]));
        showState();
      });
      showState();
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
